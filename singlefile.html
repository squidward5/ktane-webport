<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Clarity+City:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>

        :root {
            --fg: #fff;
            --muted: #a3a3a3;
            --line: rgba(255, 255, 255, 0.18);
            --bg: #000;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--fg);
            font-family: "Clarity City", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        #unity-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: var(--bg);
        }

        #unity-container canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #loading-backdrop {
            position: fixed;
            inset: 0;
            z-index: 1;
            background: var(--bg);
            transition: opacity 0.6s ease;
        }

        #watermark {
            position: fixed;
            left: 50%;
            top: 50%;
            width: min(30vw, 800px);
            transform: translate(-50%, -90%);
            mix-blend-mode: screen;
            z-index: 2;
            transition:
                transform 1s cubic-bezier(0.16, 1, 0.3, 1),
                top 1s cubic-bezier(0.16, 1, 0.3, 1),
                opacity 0.6s ease;
            will-change: transform, top;
        }

        #watermark video {
            display: block;
            width: 100%;
            height: auto;
            pointer-events: none;
        }

        #watermark-fallback {
            display: none;
            font-size: clamp(3.5rem, 9vw, 7.5rem);
            font-weight: 700;
            letter-spacing: -0.05em;
            line-height: 1;
            color: var(--fg);
            text-align: center;
            user-select: none;
        }

        body.video-missing #watermark video {
            display: none;
        }

        body.video-missing #watermark-fallback {
            display: block;
        }

        body.intro-active #watermark {
            top: 50%;
            transform: translate(-50%, calc(-50% + var(--intro-shift, 0px)));
        }

        #loading-ui {
            position: fixed;
            inset: 0;
            z-index: 3;
            pointer-events: none;
        }

        #loading-text {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            margin: 0;
            color: var(--fg);
            font-size: clamp(1.5rem, 2vw, 2.25rem);
            font-weight: 600;
            letter-spacing: 0.04em;
            white-space: nowrap;
            user-select: none;
            z-index: 2;
        }

        #loading-bar {
            position: fixed;
            left: 50%;
            top: calc(50% + 34px);
            width: min(220px, 60vw);
            height: 4px;
            overflow: hidden;
            border-radius: 999px;
            background: #333;
            transform: translate(-50%, -50%);
            z-index: 2;
        }

        #loading-progress {
            display: block;
            width: 0;
            height: 100%;
            border-radius: inherit;
            background: var(--fg);
            transition: width 0.25s ease;
        }

        #loading-meta {
            position: fixed;
            left: 50%;
            top: calc(50% + 54px);
            width: min(220px, 60vw);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transform: translate(-50%, -50%);
            z-index: 2;
        }

        #loading-details {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            color: #ccc;
            font-size: 0.75rem;
            letter-spacing: 0.04em;
            line-height: 1.2;
        }

        #loading-status {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #powered-by {
            display: block;
            margin-top: 2px;
            color: #aaa;
            font-size: 0.7rem;
            letter-spacing: 0.04em;
            line-height: 1.2;
        }

        #loading-text,
        #loading-bar,
        #loading-meta {
            transition: opacity 0.45s ease;
        }

        body.intro-active #loading-text,
        body.intro-active #loading-bar,
        body.intro-active #loading-meta {
            opacity: 0;
        }

        .loading-dots {
            display: inline-block;
            color: var(--fg);
            font-family: inherit;
            font-size: inherit;
            white-space: nowrap;
            user-select: none;
        }

        .loading-dots span {
            display: inline-block;
            margin-left: -0.12em;
            font-size: 1.5em;
            animation: dot-bounce 1.1s ease-in-out infinite;
        }

        .loading-dots span:first-child {
            margin-left: 0;
        }

        .loading-dots span:nth-child(2) {
            animation-delay: 140ms;
        }

        .loading-dots span:nth-child(3) {
            animation-delay: 280ms;
        }

        @keyframes dot-bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-0.1em);
            }
        }

        #intro-copy {
            position: fixed;
            left: 50%;
            top: 58%;
            width: min(440px, calc(100vw - 40px));
            transform: translate(-50%, 0);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            text-align: center;
            z-index: 4;
            pointer-events: none;
        }

        body.intro-copy-visible #intro-copy {
            pointer-events: auto;
        }

        #intro-copy > * {
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 0.55s ease, transform 0.55s ease;
        }

        body.intro-copy-visible #intro-copy > * {
            opacity: 1;
            transform: translateY(0);
        }

        body.intro-copy-visible #intro-copy > *:nth-child(1) { transition-delay: 0ms; }
        body.intro-copy-visible #intro-copy > *:nth-child(2) { transition-delay: 70ms; }
        body.intro-copy-visible #intro-copy > *:nth-child(3) { transition-delay: 140ms; }
        body.intro-copy-visible #intro-copy > *:nth-child(4) { transition-delay: 210ms; }
        body.intro-copy-visible #intro-copy > *:nth-child(5) { transition-delay: 280ms; }
        body.intro-copy-visible #intro-copy > *:nth-child(6) { transition-delay: 350ms; }

        #intro-kicker {
            margin: 0;
            color: var(--muted);
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: lowercase;
        }

        #intro-title {
            margin: 0;
            font-size: clamp(1.35rem, 2.4vw, 1.85rem);
            font-weight: 600;
            letter-spacing: 0.01em;
            line-height: 1.15;
        }

        #intro-text {
            margin: 0;
            max-width: 42ch;
            color: var(--muted);
            font-size: 0.9rem;
            line-height: 1.55;
        }

        #intro-text strong {
            color: var(--fg);
            font-weight: 600;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            height: 46px;
            padding: 0 26px;
            border: 1px solid transparent;
            border-radius: 999px;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.01em;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
        }

        .button:hover {
            transform: translateY(-2px);
        }

        .button:active {
            transform: translateY(0);
        }

        .button:focus-visible {
            outline: 2px solid var(--fg);
            outline-offset: 3px;
        }

        #manual-link {
            width: min(300px, 100%);
            background: var(--fg);
            color: #000;
        }

        #manual-link:hover {
            background: #e6e6e6;
        }

        #continue-button {
            width: min(300px, 100%);
            background: transparent;
            color: var(--fg);
            border-color: var(--line);
        }

        #continue-button:hover {
            border-color: var(--fg);
            background: rgba(255, 255, 255, 0.06);
        }

        #dont-show {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 4px;
            color: var(--muted);
            font-size: 0.75rem;
            letter-spacing: 0.02em;
            cursor: pointer;
            user-select: none;
        }

        #dont-show input {
            position: absolute;
            width: 1px;
            height: 1px;
            margin: -1px;
            padding: 0;
            overflow: hidden;
            clip: rect(0 0 0 0);
            clip-path: inset(50%);
            border: 0;
        }

        .checkbox-box {
            position: relative;
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 1px solid var(--line);
            border-radius: 4px;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        #dont-show input:checked + .checkbox-box {
            background: var(--fg);
            border-color: var(--fg);
        }

        #dont-show input:checked + .checkbox-box::after {
            content: "";
            position: absolute;
            left: 5px;
            top: 2px;
            width: 4px;
            height: 8px;
            border: solid #000;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        #dont-show input:focus-visible + .checkbox-box {
            outline: 2px solid var(--fg);
            outline-offset: 2px;
        }

        #dont-show:hover {
            color: var(--fg);
        }

        body.intro-closing #watermark,
        body.intro-closing #intro-copy,
        body.intro-closing #loading-backdrop {
            opacity: 0;
            pointer-events: none;
        }

        body.intro-closing #watermark {
            transform: translate(-50%, calc(-50% + var(--intro-shift, 0px))) scale(1.04);
        }

        @media (max-height: 640px) {
            #intro-copy {
                gap: 9px;
            }

            #intro-text {
                font-size: 0.8rem;
                line-height: 1.45;
            }

            .button {
                height: 40px;
                font-size: 0.82rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .loading-dots span {
                animation: none;
            }

            #watermark,
            #loading-text,
            #loading-bar,
            #loading-meta,
            #intro-copy > *,
            #loading-backdrop {
                transition: opacity 0.4s ease;
            }
        }

        span {
            text-transform: lowercase;
        }

    </style>
</head>

<body>
    <div id="unity-container"></div>
    <div id="loading-backdrop"></div>
    <div id="watermark">
        <video id="watermark-video" src="watermark.mp4" autoplay muted loop playsinline preload="auto"></video>
        <div id="watermark-fallback" aria-hidden="true">zay</div>
    </div>
    <div id="loading-ui">
        <h1 id="loading-text">loading<span class="loading-dots"><span>.</span><span>.</span><span>.</span></span></h1>
        <div id="loading-bar" role="progressbar" aria-label="Unity WebGL loading progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="loading-progress"></span></div>
        <div id="loading-meta">
            <div id="loading-details" aria-live="polite">
                <span id="loading-status">preparing unity...</span>
                <span id="loading-percent">0%</span>
            </div>
            <span id="powered-by">powered by wasm.rip</span>
        </div>

        <div id="intro-copy" aria-hidden="true">
            <p id="intro-kicker">before you play</p>
            <h2 id="intro-title">grab the bomb defusal manual</h2>
            <p id="intro-text">You should download the <strong>Bomb Defusal Manual.pdf</strong> to understand the game. It explains every module, and you'll want it open while you defuse the bomb.</p>
            <a id="manual-link" class="button" href="https://cdn.jsdelivr.net/gh/squidward5/ktane-webport@7802f66dbcbc8bf80a19583f56e6a33b984b7c6e/BombDefusalManual.pdf" target="_blank" rel="noopener">
                download manual
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M12 3v12m0 0 4.5-4.5M12 15l-4.5-4.5M4 20h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </a>
            <button id="continue-button" class="button" type="button">continue</button>
            <label id="dont-show">
                <input id="dont-show-input" type="checkbox">
                <span class="checkbox-box" aria-hidden="true"></span>
                <span>don't show again</span>
            </label>
        </div>
    </div>

    <script>
        // Assets are pinned to a commit so a launch serves exactly one build;
        // jsDelivr@main can keep serving the previous revision after a push.
        const MAIN_COMMIT = "e0cbc87dd0b33daaf09264177e05513a523a8ce1";
        const CDN_BASE = "https://cdn.jsdelivr.net/gh/squidward5/ktane-webport@" + MAIN_COMMIT;
        const BUILD_BASE = CDN_BASE + "/Build/";
        const BUILD_CONFIG_URL = BUILD_BASE + "fixed%20build.json";
        // jsDelivr will not serve the 38 MB wasm, so it comes from GitHub raw at the same commit.
        const WASM_URL = "https://raw.githubusercontent.com/squidward5/ktane-webport/" + MAIN_COMMIT + "/Build/fixed%20build.wasm";

        // Two chunks per repository keeps every file under jsDelivr's 20 MB limit.
        // Each entry pins the commit of ktane-webport-data-1 through -8, in order.
        const DATA_REPOSITORY_BASE = "https://cdn.jsdelivr.net/gh/squidward5/ktane-webport-data-";
        const DATA_REPOSITORY_REFS = [
            "4e63cbde77b57d3b607509d5d832bb52221ed809",
            "07b6bb2aec083ed83f2849210bb1f2c027851efe",
            "095b2330a4662db1169dadcfbc7eb1d57764f5e9",
            "48fdea59c7e0b7ff1cd0b201a597a389454425f1",
            "0fd50c178516477333ff6733eb581026cb1938db",
            "793a1543dcc0800425af52db27ce21e5bf7236da",
            "3c259f6ff554a897a79fd2e916e517127bfff975",
            "1150f4036140c50821e7457cd8b128528e0fd80b"
        ];
        const DATA_CHUNKS_PER_REPOSITORY = 2;
        const DATA_CHUNK_COUNT = 16;
        const DATA_CHUNK_SIZE = 16 * 1024 * 1024;
        const SKIP_INTRO_KEY = "ktane-manual-intro-skipped";

        const loadingUi = document.getElementById("loading-ui");
        const loadingBackdrop = document.getElementById("loading-backdrop");
        const watermark = document.getElementById("watermark");
        const watermarkVideo = document.getElementById("watermark-video");
        const introCopy = document.getElementById("intro-copy");
        const continueButton = document.getElementById("continue-button");
        const dontShowInput = document.getElementById("dont-show-input");
        const loadingBar = document.getElementById("loading-bar");
        const loadingProgress = document.getElementById("loading-progress");
        const loadingPercent = document.getElementById("loading-percent");
        const loadingStatus = document.getElementById("loading-status");

        let unityProgress = 0;
        let introShown = false;
        let loadingFinished = false;
        let loadingScreenRemoved = false;

        function setStatus(text) {
            loadingStatus.textContent = text;
            loadingStatus.title = text;
        }

        function updateLoadingProgress(progress) {
            unityProgress = Math.max(0, Math.min(1, progress));
            const percent = Math.round(unityProgress * 100);
            loadingProgress.style.width = percent + "%";
            loadingPercent.textContent = percent + "%";
            loadingBar.setAttribute("aria-valuenow", String(percent));
        }

        function shouldSkipIntro() {
            try {
                return window.localStorage.getItem(SKIP_INTRO_KEY) === "1";
            } catch (error) {
                return false;
            }
        }

        function rememberSkipIntro() {
            try {
                window.localStorage.setItem(SKIP_INTRO_KEY, "1");
            } catch (error) {
                // Private browsing can refuse storage; the prompt simply shows again.
            }
        }

        function placeIntroCopy() {
            // Center the whole composition: logo, gap and manual card together.
            const viewportHeight = window.innerHeight;
            const logoHeight = watermark.getBoundingClientRect().height || 100;
            const copyHeight = introCopy.offsetHeight || 280;
            const gap = 26;
            const totalHeight = logoHeight + gap + copyHeight;
            const groupTop = Math.max(24, (viewportHeight - totalHeight) / 2);
            const logoCenter = groupTop + logoHeight / 2;
            const copyTop = Math.min(groupTop + logoHeight + gap, viewportHeight - copyHeight - 24);
            document.body.style.setProperty("--intro-shift", (logoCenter - viewportHeight / 2) + "px");
            introCopy.style.top = copyTop + "px";
        }

        function revealIntroCopy() {
            if (!introShown || loadingScreenRemoved) {
                return;
            }
            // The logo must be settled before its lower edge can position the copy.
            placeIntroCopy();
            if (document.body.classList.contains("intro-copy-visible")) {
                return;
            }
            document.body.classList.add("intro-copy-visible");
            introCopy.setAttribute("aria-hidden", "false");
            continueButton.focus({ preventScroll: true });
        }

        function showIntro() {
            if (introShown || loadingScreenRemoved) {
                return;
            }
            introShown = true;
            updateLoadingProgress(1);
            placeIntroCopy();
            document.body.classList.add("intro-active");
            watermark.addEventListener("transitionend", function (event) {
                if (event.propertyName === "top" || event.propertyName === "transform") {
                    revealIntroCopy();
                }
            });
            window.setTimeout(revealIntroCopy, 700);
        }

        function removeLoadingScreen() {
            if (loadingScreenRemoved) {
                return;
            }
            loadingScreenRemoved = true;
            watermarkVideo.pause();
            loadingUi.remove();
            loadingBackdrop.remove();
            watermark.remove();
        }

        function closeLoadingScreen() {
            if (loadingScreenRemoved) {
                return;
            }
            document.body.classList.add("intro-closing");
            introCopy.setAttribute("aria-hidden", "true");
            window.setTimeout(removeLoadingScreen, 600);
        }

        function finishLoading() {
            if (loadingFinished) {
                return;
            }
            loadingFinished = true;
            if (shouldSkipIntro()) {
                updateLoadingProgress(1);
                setStatus("starting game...");
                closeLoadingScreen();
            } else {
                setStatus("ready");
                showIntro();
            }
        }

        async function fetchDataChunk(index) {
            const name = "data-" + String(index).padStart(3, "0") + ".bin";
            const repositoryNumber = Math.floor(index / DATA_CHUNKS_PER_REPOSITORY) + 1;
            const repositoryRef = DATA_REPOSITORY_REFS[repositoryNumber - 1];
            const chunkUrl = DATA_REPOSITORY_BASE + repositoryNumber + "@" + repositoryRef + "/" + name;
            const response = await fetch(chunkUrl);
            if (!response.ok) {
                throw new Error("Unity data chunk request failed with HTTP " + response.status + ": " + name);
            }

            const chunk = await response.arrayBuffer();
            const isLastChunk = index === DATA_CHUNK_COUNT - 1;
            const sizeValid = isLastChunk
                ? chunk.byteLength > 0 && chunk.byteLength <= DATA_CHUNK_SIZE
                : chunk.byteLength === DATA_CHUNK_SIZE;
            if (!sizeValid) {
                throw new Error("Unity data chunk has an unexpected size: " + name + " (" + chunk.byteLength + " bytes)");
            }
            return chunk;
        }

        async function assembleUnityData() {
            let downloaded = 0;
            const chunks = await Promise.all(
                Array.from({ length: DATA_CHUNK_COUNT }, async function (_, index) {
                    const chunk = await fetchDataChunk(index);
                    downloaded += 1;
                    setStatus("downloading game data (" + downloaded + "/" + DATA_CHUNK_COUNT + ")");
                    return chunk;
                })
            );

            const signature = new TextDecoder().decode(new Uint8Array(chunks[0], 0, 15));
            if (signature !== "UnityWebData1.0") {
                throw new Error("Unity data chunks have an invalid archive header.");
            }

            return URL.createObjectURL(new Blob(chunks, { type: "application/octet-stream" }));
        }

        function loadUnityLoader() {
            return new Promise(function (resolve, reject) {
                const script = document.createElement("script");
                script.src = BUILD_BASE + "UnityLoader.js";
                script.onload = resolve;
                script.onerror = function () {
                    reject(new Error("Unable to load " + script.src));
                };
                document.body.appendChild(script);
            });
        }

        async function startGame() {
            try {
                if (!window.UnityLoader || typeof window.UnityLoader.instantiate !== "function") {
                    throw new Error("UnityLoader.instantiate is unavailable.");
                }

                setStatus("downloading build config...");
                const response = await fetch(BUILD_CONFIG_URL);
                if (!response.ok) {
                    throw new Error("Game config request failed with HTTP " + response.status);
                }

                const config = await response.json();
                setStatus("downloading game data...");
                config.dataUrl = await assembleUnityData();
                config.wasmCodeUrl = WASM_URL;
                config.wasmFrameworkUrl = BUILD_BASE + "fixed%20build.wasm.framework.unityweb";
                setStatus("starting unity...");

                const configUrl = URL.createObjectURL(
                    new Blob([JSON.stringify(config)], { type: "application/json" })
                );
                window.UnityLoader.instantiate("unity-container", configUrl, {
                    Module: {
                        resolveBuildUrl: function (assetUrl) {
                            if (/^(https?|ftp|file):\/\//.test(assetUrl) || assetUrl.indexOf("blob:") === 0) {
                                return assetUrl;
                            }
                            if (/\.wasm(?:$|\?)/i.test(assetUrl)) {
                                return config.wasmCodeUrl;
                            }
                            return new URL("Build/" + assetUrl, CDN_BASE + "/").href;
                        },
                        locateFile: function (fileName) {
                            if (/\.wasm(?:$|\?)/i.test(fileName)) {
                                return config.wasmCodeUrl;
                            }
                            return new URL("Build/" + fileName, CDN_BASE + "/").href;
                        }
                    },
                    onProgress: function (_gameInstance, progress) {
                        updateLoadingProgress(progress);
                        if (progress < 0.9) {
                            setStatus("downloading unity runtime...");
                        } else if (progress < 1) {
                            setStatus("initializing webgl...");
                        }
                        if (progress >= 1) {
                            finishLoading();
                        }
                    },
                    onerror: function (error) {
                        setStatus("unable to load the game");
                        console.error("Unity WebGL failed to load:", error);
                    }
                });
            } catch (error) {
                setStatus("unable to load the game");
                console.error("Unable to load the game:", error);
            }
        }

        // The real logo is watermark.mp4; when it cannot be fetched, the plain
        // "zay" wordmark takes its place and the intro plays the same way.
        const videoFallbackTimer = window.setTimeout(function () {
            if (!watermarkVideo.videoWidth) {
                document.body.classList.add("video-missing");
            }
        }, 4000);

        watermarkVideo.addEventListener("loadeddata", function () {
            window.clearTimeout(videoFallbackTimer);
            document.body.classList.remove("video-missing");
        });

        watermarkVideo.addEventListener("error", function () {
            window.clearTimeout(videoFallbackTimer);
            document.body.classList.add("video-missing");
        });

        watermarkVideo.play().catch(function () {
            // Autoplay can be blocked; the first frame or the fallback still shows.
        });

        continueButton.addEventListener("click", function () {
            if (dontShowInput && dontShowInput.checked) {
                rememberSkipIntro();
            }
            closeLoadingScreen();
        });

        window.addEventListener("resize", function () {
            if (introShown && !loadingScreenRemoved) {
                placeIntroCopy();
            }
        });

        window.requestAnimationFrame(function () {
            loadUnityLoader()
                .then(startGame)
                .catch(function (error) {
                    setStatus("unity loader not found");
                    console.error(error);
                });
        });
