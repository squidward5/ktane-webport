<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <base href="./">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Keep Talking and Nobody Explodes</title>
    <script src="Build/UnityLoader.js"></script>
    <style>
      html, body {
        margin: 0;
      }

      #unityContainer {
        width: 100%;
        height: 100%;
        border: none;
      }
      
    </style>
    <script>
      const DATA_CHUNK_COUNT = 16;
      const DATA_CHUNK_SIZE = 16 * 1024 * 1024;
      const DATA_TOTAL_SIZE = 263232226;

      async function assembleUnityData() {
        const chunks = await Promise.all(
          Array.from({ length: DATA_CHUNK_COUNT }, async function (_, index) {
            const name = "data-" + String(index).padStart(3, "0") + ".bin";
            const response = await fetch(new URL("data/" + name, window.location.href));
            if (!response.ok) {
              throw new Error("Unity data chunk request failed with HTTP " + response.status + ": " + name);
            }

            const chunk = await response.arrayBuffer();
            const expectedSize = index === DATA_CHUNK_COUNT - 1
              ? DATA_TOTAL_SIZE - DATA_CHUNK_SIZE * (DATA_CHUNK_COUNT - 1)
              : DATA_CHUNK_SIZE;
            if (chunk.byteLength !== expectedSize) {
              throw new Error("Unity data chunk has an unexpected size: " + name);
            }
            return chunk;
          })
        );

        const signature = new TextDecoder().decode(new Uint8Array(chunks[0], 0, 15));
        if (signature !== "UnityWebData1.0") {
          throw new Error("Unity data chunks have an invalid archive header.");
        }

        return URL.createObjectURL(new Blob(chunks, { type: "application/octet-stream" }));
      }

      async function startUnity() {
        const status = document.getElementById("loadStatus");
        try {
          const response = await fetch("Build/fixed build.json");
          if (!response.ok) {
            throw new Error("Game config request failed with HTTP " + response.status);
          }

          const config = await response.json();
          status.textContent = "Loading game data...";
          config.dataUrl = await assembleUnityData();
          config.wasmCodeUrl = new URL("Build/fixed build.wasm", window.location.href).href;
          config.wasmFrameworkUrl = new URL("Build/fixed build.wasm.framework.unityweb", window.location.href).href;

          const configUrl = URL.createObjectURL(
            new Blob([JSON.stringify(config)], { type: "application/json" })
          );
          UnityLoader.instantiate("unityContainer", configUrl, {
            Module: {
              resolveBuildUrl: function (assetUrl) {
                if (/^(https?|ftp|file):\/\//.test(assetUrl) || assetUrl.indexOf("blob:") === 0) {
                  return assetUrl;
                }
                if (/\.wasm(?:$|\?)/i.test(assetUrl)) {
                  return config.wasmCodeUrl;
                }
                return new URL("Build/" + assetUrl, window.location.href).href;
              },
              locateFile: function (fileName) {
                if (/\.wasm(?:$|\?)/i.test(fileName)) {
                  return config.wasmCodeUrl;
                }
                return new URL("Build/" + fileName, window.location.href).href;
              }
            },
            onerror: function (error) {
              console.error("Unity failed to start:", error);
              status.textContent = "The game could not start. Check the connection and the Build folder.";
            }
          });
          status.textContent = "Starting game...";
        } catch (error) {
          console.error("Unable to load the game:", error);
          status.textContent = "The game could not be loaded. Check the connection and the Build folder.";
        }
      }

      window.addEventListener("DOMContentLoaded", startUnity);
    </script>
  </head>
  <body>
    <div id="unityContainer"></div>
  </body>
</html>
