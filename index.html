<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>Keep Talking and Nobody Explodes</title>

<script src="Build/UnityLoader.js"></script>

<style>
html, body {
    margin: 0;
    border: none;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #181818;
    color: #eee;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    box-sizing: border-box;
}

#menu {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
}

.box {
    width: 500px;
    max-width: 90%;
    text-align: center;
}

h1 {
    margin: 0 0 20px;
    font-size: 34px;
    font-weight: normal;
}

p {
    color: #bbb;
    line-height: 1.5;
}

.buttons {
    margin-top: 30px;
}

a,
button {
    display: inline-block;
    margin: 6px;
    padding: 12px 22px;
    background: #2d2d2d;
    color: white;
    text-decoration: none;
    border: 1px solid #555;
    cursor: pointer;
    font-size: 15px;
}

a:hover,
button:hover {
    background: #3b3b3b;
}

#unityContainer {
    display: none;
    width: 100vw;
    height: 100vh;
    border: none;
    margin: 0;
    padding: 0;
}
</style>
</head>

<body>

<div id="menu">
    <div class="box">
        <h1>Keep Talking and Nobody Explodes</h1>

        <p>
            Before playing, you will need the download manual for the game. You can download it by clicking the button below. Once you have the manual, click "Start Game" to begin.
        </p>

        <div class="buttons">
            <a href="BombDefusalManual.pdf" download>Download Manual</a>
            <button onclick="startGame()">Start Game</button>
        </div>

        <label style="display:inline-flex;align-items:center;gap:8px;margin-top:16px;color:#bbb;cursor:pointer;">
            <input id="dontShowAgain" type="checkbox">
            <span>Don't show again</span>
        </label>
    </div>
</div>

<div id="unityContainer"></div>

<script>
const STORAGE_KEY = "ktaneIntroHidden";

function shouldSkipIntro() {
    try {
        return localStorage.getItem(STORAGE_KEY) === "true";
    } catch (e) {
        return false;
    }
}

function applySavedPreference() {
    const checkbox = document.getElementById("dontShowAgain");
    if (!checkbox) return;
    checkbox.checked = shouldSkipIntro();
}

function saveIntroPreference() {
    const checkbox = document.getElementById("dontShowAgain");
    if (!checkbox) return;

    try {
        localStorage.setItem(STORAGE_KEY, checkbox.checked ? "true" : "false");
    } catch (e) {
        // ignore storage errors
    }
}

function startGame() {
    saveIntroPreference();

    document.getElementById("menu").style.display = "none";
    document.getElementById("unityContainer").style.display = "block";

    if (!window.unityInstance) {
        window.unityInstance = UnityLoader.instantiate(
            "unityContainer",
            "Build/ktanefix.WebGL.json",
            {
                Module: {
                    dataUrl: "https://media.githubusercontent.com/media/squidward5/ktane-webport/149d110/Build/ktanefix.WebGL.data.unityweb"
                }
            }
        );
    }
}

window.addEventListener("DOMContentLoaded", function () {
    applySavedPreference();

    document.getElementById("dontShowAgain").addEventListener("change", function () {
        // only save the preference, do not start the game immediately
        saveIntroPreference();
    });

    if (shouldSkipIntro()) {
        startGame();
    }
});
</script>

</body>
</html>
